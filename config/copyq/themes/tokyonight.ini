[Theme]
bg=                     #1a1b26
edit_bg=                #1a1b26
fg=                     #c0caf5
edit_fg=                #c0caf5
alt_bg=                 #16161e
sel_bg=                 #364a82
sel_fg=                 #c0caf5
find_bg=                #ff9e64
find_fg=                #1a1b26
notes_bg=               #1e2030
notes_fg=               #c0caf5
notification_bg=        #1a1b26
notification_fg=        #c0caf5

font=                   "JetBrains Mono,10,-1,5,50,0,0,0,0,0"
edit_font=              "JetBrains Mono,10,-1,5,50,0,0,0,0,0"
log_font=               "JetBrains Mono,9,-1,5,50,0,0,0,0,0"
system_font=            false

icon_size=              18
icon_size_small=        14

use_system_icons=       false
hide_shortcuts=         false

css="
* {
  color: #c0caf5;
  background: #1a1b26;
  border: none;
  outline: none;
}

QMainWindow, QDialog {
  background: #1a1b26;
}

#ClipboardBrowser {
  background: #1a1b26;
  alternate-background-color: #16161e;
  border: 1px solid #3b4261;
  border-radius: 6px;
}

#ClipboardBrowser::item {
  padding: 4px 8px;
  border-radius: 4px;
}

#ClipboardBrowser::item:selected {
  background: #364a82;
  color: #c0caf5;
}

#ClipboardBrowser::item:hover {
  background: #24283b;
}

QScrollBar:vertical {
  background: #16161e;
  width: 6px;
  border-radius: 3px;
}

QScrollBar::handle:vertical {
  background: #3b4261;
  border-radius: 3px;
  min-height: 20px;
}

QScrollBar::add-line:vertical, QScrollBar::sub-line:vertical {
  height: 0px;
}

QLineEdit, QTextEdit {
  background: #16161e;
  color: #c0caf5;
  border: 1px solid #3b4261;
  border-radius: 4px;
  padding: 4px;
  selection-background-color: #364a82;
}

QLineEdit:focus, QTextEdit:focus {
  border: 1px solid #7aa2f7;
}

QToolBar {
  background: #16161e;
  border-bottom: 1px solid #3b4261;
  padding: 2px;
  spacing: 2px;
}

QToolButton {
  background: transparent;
  border-radius: 4px;
  padding: 3px;
  color: #c0caf5;
}

QToolButton:hover {
  background: #24283b;
}

QToolButton:pressed {
  background: #364a82;
}

QTabWidget::pane {
  border: 1px solid #3b4261;
  background: #1a1b26;
}

QTabBar::tab {
  background: #16161e;
  color: #565f89;
  padding: 6px 14px;
  border: none;
  border-bottom: 2px solid transparent;
}

QTabBar::tab:selected {
  color: #c0caf5;
  border-bottom: 2px solid #7aa2f7;
  background: #1a1b26;
}

QTabBar::tab:hover {
  color: #c0caf5;
  background: #24283b;
}

QMenu {
  background: #1a1b26;
  border: 1px solid #3b4261;
  border-radius: 6px;
  padding: 4px;
}

QMenu::item {
  padding: 5px 20px;
  border-radius: 4px;
  color: #c0caf5;
}

QMenu::item:selected {
  background: #364a82;
}

QMenu::separator {
  height: 1px;
  background: #3b4261;
  margin: 3px 8px;
}

QStatusBar {
  background: #16161e;
  color: #565f89;
  border-top: 1px solid #3b4261;
}
"

notification_css="
QWidget {
  background: #1a1b26;
  color: #c0caf5;
  border: 1px solid #7aa2f7;
  border-radius: 6px;
}
"
