#font_family MesloLGS NF
##############################################
#  KITTY CONFIG – Victor (Sway/SwayFX setup)
##############################################

startup_session ~/.config/kitty/startup.session

#--------------------------------------------
# FONDAMENTAUX
#--------------------------------------------
# font_family      JetBrainsMono Nerd Font
font_size        12.5
disable_ligatures never

# Padding intérieur
window_padding_width 6

# Wayland (important avec Sway/SwayFX)
wayland_titlebar_color system
wayland_enable_frame_callbacks yes

# Meilleur rendu (subpixel AA)
font_hinting full
font_antialias true

# Désactiver la cloche
enable_audio_bell no

# Scrollback large
scrollback_lines 10000

#--------------------------------------------
# ZOOM (taille de police dynamique)
#--------------------------------------------
map ctrl+shift+equal        increase_font_size
map ctrl+shift+minus        decrease_font_size
map ctrl+shift+backspace    restore_font_size

#--------------------------------------------
# ONGLETS & SPLITS
#--------------------------------------------
tab_bar_min_tabs 1
tab_bar_style powerline
tab_bar_background #24273a
tab_title_template "{title}"

# Raccourcis tab (simples)
map ctrl+shift+t        new_tab
map ctrl+shift+q        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+r        set_tab_title

# Splits
map ctrl+shift+enter    launch --location=vsplit
map ctrl+shift+n        launch --location=hsplit
map ctrl+shift+w        close_window

#--------------------------------------------
# RENOMMAGE AUTOMATIQUE DES TABS EN SSH
#--------------------------------------------
allow_remote_control yes
listen_on unix:/tmp/kitty

# Renomme automatiquement au lancement SSH via kitten
# (Ex: kitty +kitten ssh srvprod → tab = srvprod)

#--------------------------------------------
# COULEURS — CATPPUCCIN MACCHIATO
#--------------------------------------------
foreground              #cad3f5
background              #24273a
selection_background    #5b6078
selection_foreground    #cad3f5
cursor                  #f4dbd6

# Palette
color0  #494d64
color1  #ed8796
color2  #a6da95
color3  #eed49f
color4  #8aadf4
color5  #c6a0f6
color6  #8bd5ca
color7  #b8c0e0
color8  #5b6078
color9  #ed8796
color10 #a6da95
color11 #eed49f
color12 #8aadf4
color13 #c6a0f6
color14 #8bd5ca
color15 #a5adcb

#--------------------------------------------
# COMPORTEMENT
#--------------------------------------------

# Copie auto avec sélection
copy_on_select yes

# Hyper liens
detect_urls yes

# Live reload config
reload_on_sighup yes

#--------------------------------------------
# SSH AUTOMATIQUE (optionnel)
#--------------------------------------------
# Exemple si tu veux des raccourcis :
# map ctrl+shift+s kitten ssh srvdeg
# map ctrl+shift+p kitten ssh srvprod
#tab_title_template "{shell, ~/.local/bin/kitty-auto-title {cwd}, LOCAL}"



# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS