;==========================================================
; Polybar config - 3 monitors (left=eDP-1, center=DP-1-2, right=DP-1-3)
;==========================================================

[colors]
background  = #CC282A36
foreground  = #F8F8F2
primary     = #f76c6c
secondary   = #81A1C1
accent      = #BD93F9
warning     = #FF5555
disabled    = #6272A4
success     = #50FA7B

;==========================================================
; BARRE GAUCHE (laptop eDP-1)
;==========================================================
[bar/left]
monitor = ${env:MONITOR:eDP-1}
width = 100%
height = 28pt
offset-x = 0
offset-y = 0
radius = 10
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 1
padding-left = 1
padding-right = 2
module-margin = 1

font-0 = Victor Mono:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;2
font-2 = Font Awesome 6 Brands:size=10;2

modules-left = i3
modules-center = date localip
modules-right = keybindings screenshot pulseaudio memory cpu load temperature battery systray

separator =
enable-ipc = true
cursor-click = pointer
wm-restack = i3

[bar/center]
monitor = ${env:MONITOR}
width = 100%
height = 28pt
offset-x = 0
offset-y = 0
radius = 10
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 1
padding-left = 1
padding-right = 2
module-margin = 1

font-0 = Victor Mono:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;2
font-2 = Font Awesome 6 Brands:size=10;2

modules-left = i3
modules-center = date localip
modules-right = keybindings screenshot pulseaudio memory cpu load temperature eth battery

separator =
enable-ipc = true
cursor-click = pointer
wm-restack = i3

[bar/right]
monitor = ${env:MONITOR}
width = 100%
height = 28pt
offset-x = 0
offset-y = 0
radius = 10
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 1
padding-left = 1
padding-right = 2
module-margin = 1

font-0 = Victor Mono:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;2
font-2 = Font Awesome 6 Brands:size=10;2

modules-left = i3
modules-center = date localip
modules-right = keybindings screenshot pulseaudio memory cpu load temperature

separator =
enable-ipc = true
cursor-click = pointer
wm-restack = i3

;==========================================================
; MODULES
;==========================================================

[module/keybindings]
type = custom/script
exec = echo "⌨ keys"
interval = 3600
format-foreground = ${colors.accent}
format-background = ${colors.background}
format-padding = 1
click-left = ~/bin/keybindings.sh &

[module/screenshot]
type = custom/script
exec = echo "%{T2}%{T-}"
interval = 3600
format-foreground = ${colors.accent}
format-padding = 1
click-left = flameshot gui &
click-right = flameshot full -p /home/vgermain/Images/ -c &

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt

[module/i3]
type = internal/i3
show-urgent = true
strip-wsnumbers = false
index-sort = true
pin-workspaces = true

label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = #F8F8F2
label-focused-padding = 2

label-occupied = %index%
label-occupied-foreground = ${colors.secondary}
label-occupied-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.warning}
label-urgent-padding = 2

label-empty = %index%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/date]
type = internal/date
interval = 60
date = %A %d %b
time = %H:%M
label = %{T2}%{T-} %date%   %{T2}%{T-} %time%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = "%{T2}%{T-} "
format-volume-prefix-foreground = ${colors.secondary}
label-volume = %percentage%%
format-muted-prefix = "%{T2}%{T-} "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 5
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.accent}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/load]
type = custom/script
interval = 5
exec = awk '{printf "%.2f", $1}' /proc/loadavg
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.secondary}
label = %output%

[module/localip]
type = custom/script
exec = ~/bin/polybar-ip.sh
interval = 30
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.secondary}
label = %output%

[module/temperature]
type = internal/temperature
hwmon-path = /sys/class/hwmon/hwmon8/temp1_input
base-temperature = 20
warn-temperature = 80
interval = 5
format = <label>
format-prefix = "%{T2}%{T-} "
format-prefix-foreground = ${colors.accent}
label = %temperature-c%
format-warn = <label-warn>
format-warn-prefix = "%{T2}%{T-} "
format-warn-prefix-foreground = ${colors.warning}
label-warn = %temperature-c%
label-warn-foreground = ${colors.warning}

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 5
format-connected = <label-connected>
format-connected-prefix = "%{T2}%{T-} "
format-connected-prefix-foreground = ${colors.success}
label-connected = %signal%%
label-connected-foreground = ${colors.success}
format-disconnected = <label-disconnected>
label-disconnected = "%{T2}%{T-} no wifi"
label-disconnected-foreground = ${colors.disabled}

[module/eth]
type = internal/network
interface = enp0s31f6
interval = 5
format-connected = <label-connected>
format-connected-prefix = "%{T2}%{T-} "
format-connected-prefix-foreground = ${colors.secondary}
label-connected = %local_ip%
format-disconnected =

[module/battery]
type = custom/script
exec = ~/bin/polybar-battery.sh
interval = 30
format = <label>
label = %output%

[settings]
screenchange-reload = true
pseudo-transparency = true
